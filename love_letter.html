<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cuto</title>
<style>
  :root {
    --pink: #f7a8b8;
    --pink-light: #ffe1e5;
    --pink-dark: #d96f85;
    --red: #f43d57;
    --ink: #522b3a;
    --cream: #fff0dc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; overflow: hidden;
    display: grid; place-items: center;
    font-family: "Courier New", monospace;
    color: var(--ink);
    background: radial-gradient(circle at 20% 25%, #ffe0e5, transparent 42%),
                radial-gradient(circle at 82% 72%, #fff0d8, transparent 42%),
                linear-gradient(135deg, #ffe8e7, #fff4df);
  }
  .hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .floating-heart {
    position: absolute; color: #e96d86; opacity: .65;
    animation: drift linear infinite; user-select: none;
  }
  @keyframes drift {
    from { transform: translateY(110vh) rotate(0deg); }
    to { transform: translateY(-15vh) rotate(28deg); }
  }
  .window {
    width: min(340px, calc(100vw - 34px));
    border: 3px solid #d8798d; border-radius: 12px;
    background: #ffd5dd; overflow: hidden;
    box-shadow: 0 12px 30px #9f52602b, inset 0 0 0 2px #ffedf0;
    position: relative; z-index: 1;
    transition: transform .35s ease;
  }
  .titlebar {
    height: 42px; display: flex; align-items: center;
    justify-content: space-between; padding: 0 12px;
    background: #ffb7c5; border-bottom: 3px solid #d8798d;
    font-family: Arial, sans-serif; font-weight: 800; letter-spacing: .5px;
    font-size: 14px;
  }
  .controls { display: flex; gap: 5px; }
  .controls span {
    display: grid; place-items: center; width: 17px; height: 17px;
    background: #fff1ef; border: 1px solid #d8798d; border-radius: 3px;
    color: #bb6277; font-size: 11px; line-height: 1;
  }
  .toolbar {
    height: 32px; display: flex; justify-content: center; align-items: center;
    gap: 12px; color: #e34360; background: #ffe2e7;
    border-bottom: 2px solid #e99aaa;
  }
  .content {
    min-height: 310px; padding: 22px 16px 20px; text-align: center;
    background-color: #ffdce2;
    background-image: linear-gradient(#f5aab9 1px, transparent 1px),
                      linear-gradient(90deg, #f5aab9 1px, transparent 1px);
    background-size: 10px 10px;
  }
  h1 { margin: 0 auto 12px; font-size: clamp(17px, 4.6vw, 21px); line-height: 1.25; }
  .cat-wrap { height: 112px; display: grid; place-items: center; margin: 0 auto 8px; }
  .cat { width: 126px; height: 100px; image-rendering: pixelated; }
  .buttons { display: flex; align-items: center; justify-content: center; gap: 16px; }
  button {
    font-family: inherit; font-weight: 900; cursor: pointer;
    border: 2px solid #ce3049; border-radius: 7px;
    box-shadow: 0 4px 0 #b82d43; transition: transform .15s, left .2s, top .2s;
  }
  #yes {
    color: white; background: #f43d57; font-size: 17px;
    padding: 10px 25px; text-shadow: 1px 1px #c52e45;
  }
  #yes:hover { transform: translateY(-2px) scale(1.04); }
  #no { color: #a43b51; background: #fff7f3; padding: 7px 13px; font-size: 12px; }
  .message { min-height: 22px; margin-top: 15px; font-size: 13px; font-weight: bold; }
  .window.won { animation: happy .65s ease; }
  @keyframes happy { 0%,100% { transform: scale(1) rotate(0); } 35% { transform: scale(1.05) rotate(-2deg); } 70% { transform: scale(1.05) rotate(2deg); } }
  .sparkle { position: fixed; z-index: 2; pointer-events: none; animation: pop 1.1s ease-out forwards; }
  @keyframes pop { from { transform: translateY(0) scale(.5); opacity: 1; } to { transform: translateY(-130px) scale(1.5); opacity: 0; } }
  @media (max-height: 560px) { .content { min-height: 260px; padding-top: 12px; } .cat-wrap { height: 85px; } .cat { width: 105px; height: 84px; } }
</style>
</head>
<body>
<div class="hearts" id="hearts" aria-hidden="true"></div>

<main class="window" id="window">
  <header class="titlebar">
    <span>daubuoi</span>
    <div class="controls" aria-hidden="true"><span>−</span><span>□</span><span>×</span></div>
  </header>
  <div class="toolbar" aria-hidden="true"><span>♥</span><span>♥</span><span>♥</span><span>♥</span></div>
  <section class="content">
    <h1 id="question">Bạn cuto không?</h1>
    <div class="cat-wrap">
      <svg class="cat" viewBox="0 0 126 100" role="img" aria-label="Pixel art black cat holding a red heart" shape-rendering="crispEdges">
        <!-- ears and body -->
        <path fill="#17151a" d="M12 26h18V8h12v10h12v12h28V18h12V8h12v18h8v28h-8v20h-9v10H29V76h-9V56h-8z"/>
        <!-- face highlights -->
        <path fill="#fff7f0" d="M24 34h18v18H24z M84 34h18v18H84z"/>
        <path fill="#17151a" d="M30 37h8v14h-8z M90 37h8v14h-8z"/>
        <!-- cheeks and paws -->
        <path fill="#29232b" d="M8 56h20v18h12v10H25V76H12z M98 56h20v18h-8v8H94V72h4z"/>
        <!-- heart -->
        <path fill="#f52f4e" d="M51 58h-8v-8h8v-8h12v8h8v8h-8v8h-4v8h-8v-8h-8v-8z"/>
        <path fill="#ff6b7d" d="M47 48h8v5h-8z"/>
        <!-- tiny nose -->
        <path fill="#f7a8b8" d="M59 53h8v5h-8z"/>
      </svg>
    </div>
    <div class="buttons">
      <button id="yes" type="button">YES</button>
      <button id="no" type="button">NO</button>
    </div>
    <div class="message" id="message" aria-live="polite"></div>
  </section>
</main>
<script>
  const heartLayer = document.getElementById('hearts');
  const symbols = ['♥', '♡', '✦'];
  for (let i = 0; i < 28; i++) {
    const heart = document.createElement('span');
    heart.className = 'floating-heart';
    heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    heart.style.left = Math.random() * 100 + '%';
    heart.style.fontSize = (8 + Math.random() * 12) + 'px';
    heart.style.animationDuration = (8 + Math.random() * 13) + 's';
    heart.style.animationDelay = (-Math.random() * 18) + 's';
    heart.style.opacity = (.2 + Math.random() * .55).toFixed(2);
    heartLayer.appendChild(heart);
  }

  const noButton = document.getElementById('no');
  const yesButton = document.getElementById('yes');
  const message = document.getElementById('message');
  const windowCard = document.getElementById('window');
  let noCount = 0;

  function dodgeNo() {
    noCount++;
    const phrases = ['Tại sao? 🥺', 'Tôi thích bạn💗', 'Bạn thích tôi không!'];
    message.textContent = phrases[Math.min(noCount - 1, phrases.length - 1)];
    noButton.style.transform = `translate(${Math.random() * 80 - 40}px, ${Math.random() * 45 - 22}px)`;
  }
  noButton.addEventListener('mouseenter', dodgeNo);
  noButton.addEventListener('click', dodgeNo);
  noButton.addEventListener('touchstart', (event) => {
    event.preventDefault();
    dodgeNo();
  }, { passive: false });

  yesButton.addEventListener('click', () => {
    document.getElementById('question').innerHTML = 'Tôi Là Gay ♡';
    message.textContent = 'Lgbt💖';
    noButton.style.display = 'none';
    yesButton.textContent = 'I am Gay';
    windowCard.classList.remove('won');
    void windowCard.offsetWidth;
    windowCard.classList.add('won');
    for (let i = 0; i < 24; i++) {
      const s = document.createElement('span');
      s.className = 'sparkle';
      s.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      s.style.left = (10 + Math.random() * 80) + 'vw';
      s.style.top = (45 + Math.random() * 40) + 'vh';
      s.style.fontSize = (16 + Math.random() * 20) + 'px';
      s.style.color = ['#f43d57', '#d96f85', '#ffb52e'][i % 3];
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 1200);
    }
  });
</script>
</body>
</html>
